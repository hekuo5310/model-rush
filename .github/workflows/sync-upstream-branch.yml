name: 同步上游 PR 分支

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出测试版主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 生成不含测试版标记的上游同步分支
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin upstream-sync || true
          git remote add upstream https://github.com/mukunjin/model-rush.git
          git fetch upstream main --depth=1

          # 从 main 的最新树重新生成，确保同步分支始终包含全部功能改动。
          git switch --detach origin/main
          git switch -C upstream-sync

          # README 直接采用正式版版本；其余两个标记块仅用于测试版页面。
          git show upstream/main:README.md > README.md
          node <<'NODE'
          const fs = require('fs');

          function removeBlock(path, start, end) {
            const source = fs.readFileSync(path, 'utf8');
            const startAt = source.indexOf(start);
            const endAt = source.indexOf(end);
            if (startAt === -1 || endAt === -1 || endAt < startAt) {
              throw new Error(`未找到 ${path} 中的测试版标记块`);
            }
            const before = source.slice(0, startAt).replace(/[ \t]*$/, '');
            const after = source.slice(endAt + end.length).replace(/^\r?\n/, '');
            fs.writeFileSync(path, before + '\n' + after);
          }

          removeBlock('index.html', '<!-- beta-only:project-footer:start -->', '<!-- beta-only:project-footer:end -->');
          removeBlock('css/style.css', '/* beta-only:project-footer-style:start */', '/* beta-only:project-footer-style:end */');
          removeBlock('css/style.css', '/* beta-only:project-footer-mobile-style:start */', '/* beta-only:project-footer-mobile-style:end */');
          NODE

          # 工作流只应存在于测试版 main，不能成为上游 PR 的变更。
          rm .github/workflows/sync-upstream-branch.yml
          git add -A
          git commit -m "同步测试版功能到上游 PR 分支" || exit 0
          git push --force-with-lease origin HEAD:upstream-sync
